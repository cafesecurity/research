# Checks that the website builds cleanly. Cloudflare builds and deploys it separately
# (see wrangler.jsonc); this keeps the same check visible on every pull request.
name: Site build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install pinned tools
        run: python -m pip install -r site/requirements.txt
      - name: Assemble pages from the repository
        run: python3 scripts/build_site.py
      - name: Build
        run: mkdocs build --strict
