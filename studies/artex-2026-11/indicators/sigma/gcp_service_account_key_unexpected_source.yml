title: Google Cloud service account used from outside your own networks
id: 2f6a2b0e-9a51-4c6e-8b0e-6b4c0f2d6a11
status: experimental
description: |
  A service account (a machine credential) makes an API call from an address outside the
  networks and cloud ranges you list. Stolen machine credentials were the route through in
  most ARTEX incidents. Bitrise reported that alerting
  on keys used outside its own ranges matched every stolen-key use in its advisory.
  STARTING POINT: replace the placeholder ranges with your own, and exclude service accounts
  that legitimately run elsewhere.
references:
  - https://research.cafesecurity.com/artex/readiness/
  - https://bitrise.io/security-advisory-november-2026
author: Café Security Research
date: 2026-11-26
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    protoPayload.authenticationInfo.principalEmail|endswith: '.iam.gserviceaccount.com'
  filter_own_ranges:
    protoPayload.requestMetadata.callerIp|cidr:
      - '10.0.0.0/8'          # placeholder: your networks
      - '192.0.2.0/24'        # placeholder: your egress addresses
  filter_google_internal:
    protoPayload.requestMetadata.callerIp:
      - 'private'
      - 'gce-internal-ip'
  condition: selection and not 1 of filter_*
falsepositives:
  - Service accounts used from partners, CI providers or new regions you haven't listed
level: high
