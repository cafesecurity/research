- id: C083
  topic: safety
  statement: The asset gate guards ARTEX's records, not the network. Commands aren't checked against it, work with no asset attached skips it, and when recording assets it's skipped if the rules can't be read. (When handing out work, a read error blocks the work.)
  status: code
  evidence:
    - {type: absent, source: artex-v0.3.15, pattern: "AssetIntercept|EvaluateAssetGate", include: ["guard/*.go", "intercept/*.go"], exclude: ["*_test.go"]}
