claims:

# --- Provenance -------------------------------------------------------------------

- id: C001
  topic: provenance
  statement: The FailSafe build is a source rebuild that keeps ARTEX's full capability; it isn't a reduced or "defanged" version.
  status: code
  evidence:
    - {type: contains, source: failsafe, path: README.md, lines: 14, text: "full runtime capabilities"}

- id: C002
  topic: provenance
  statement: FailSafe's notes say its Go files are identical to v0.3.15 apart from listed changes, but ten production Go files differ. None of the differences affects the safety findings in this study.
  status: code
  note: The second sentence's "none affects the findings" was judged by reading each diff; the differences cover prompt ordering, the browser plugin's launch command, address parsing, tool ordering, self-update and file serving.
  evidence:
    - {type: contains, source: failsafe, path: UPSTREAM.md, lines: 28-30, text: "byte-identical to the audited `v0.3.15` tree"}
    - type: differs
      a: artex-v0.3.15
      b: failsafe
      paths: [agent/deferred.go, agent/worker.go, db/db.go, selfupdate/github.go, selfupdate/stage.go, server/assembly.go, server/server.go, server/update.go, server/webui_embed.go, server/static_files.go]

- id: C003
  topic: provenance
  statement: The original repository is no longer available; FailSafe used the surviving RuoJi6/ARTEX copy, choosing v0.3.15 because it predates the prebuilt image that carried a backdoor.
  status: code
  evidence:
    - {type: contains, source: failsafe, path: UPSTREAM.md, lines: 14-17, text: "predates"}

- id: C004
  topic: provenance
  statement: Prebuilt images published as tomicdd/artex (and copies as congdonglinux/artex) carried a hidden command-execution backdoor in the login code. Anyone who used them should treat that deployment as fully compromised and rebuild it.
  status: source
  evidence:
    - {type: contains, source: failsafe, path: UPSTREAM.md, lines: 93-97, text: "tomicdd/artex"}
    - {type: url, ref: S3}

- id: C005
  topic: provenance
  statement: The reviewed v0.3.15 source contains no trace of the backdoor function.
  status: code
  evidence:
    - {type: absent, source: artex-v0.3.15, pattern: "verifyCaptcha", include: ["*.go"]}

- id: C006
  topic: provenance
  statement: The backdoored image was pulled about 9,000 times (pulls, not deployments), and 62 internet-facing consoles served the backdoored build between 2 and 4 November 2026.
  status: source
  evidence:
    - {type: url, ref: S3}

- id: C007
  topic: provenance
  statement: The surviving upstream copy has 16 tagged releases, v0.3.15 to v0.3.30, dated 9 October to 14 November 2026, after the original was withdrawn on 8 October.
  status: code
  note: Tag dates are commit metadata and can be set freely. The withdrawal date is from S9.
  evidence:
    - {type: manual, how: "git ls-remote --tags on the upstream copy lists the tags; each tag commit's date is its committer date"}
    - {type: url, ref: S9}

- id: C008
  topic: provenance
  statement: FailSafe notes its own limit - a reproducible build proves the binary matches the source tree, not that the tree matches the original author's last release.
  status: code
  evidence:
    - {type: contains, source: failsafe, path: SECURITY.md, lines: 68-69, text: "not that the tree matches the original author's last release"}

# --- The engine -------------------------------------------------------------------

- id: C010
  topic: engine
  statement: ARTEX is built on a separate agent engine, Autumn-27/norma v0.4.3, and pins its module hash.
  status: code
  evidence:
    - {type: contains, source: artex-v0.3.15, path: go.mod, lines: 6, text: "github.com/Autumn-27/norma v0.4.3"}
    - {type: contains, source: artex-v0.3.15, path: go.sum, lines: 1, text: "h1:DnmOhJPL6OZSMnCVYO5Ujh4yVINuDarEickVi9jx1hI="}

- id: C011
  topic: engine
  statement: The public norma v0.4.3 tag is exactly the module ARTEX builds against - its Go module hash matches ARTEX's pin.
  status: code
  evidence:
    - {type: module_hash, source: norma-v0.4.3, module: github.com/Autumn-27/norma, version: v0.4.3, h1: "h1:DnmOhJPL6OZSMnCVYO5Ujh4yVINuDarEickVi9jx1hI="}

- id: C012
  topic: engine
  statement: norma describes itself as a general-purpose agent SDK that could drive a coding agent, a security auditor or a customer-support bot; it isn't a hacking tool.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: README.md, lines: 3, text: "general-purpose"}
    - {type: contains, source: norma-v0.4.3, path: README.md, lines: 5, text: "customer-support bot"}

- id: C013
  topic: engine
  statement: For each tool call the engine checks approvals first and runs the host's pre-tool hooks afterwards, so ARTEX's guard (a hook) still runs when approvals are bypassed.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: harness/tools.go, lines: 57-60, text: "permission.Evaluate"}
    - {type: contains, source: norma-v0.4.3, path: harness/tools.go, lines: 76-83, text: "PreToolUse"}

- id: C014
  topic: engine
  statement: In bypass mode the engine allows every tool call except tools named in a deny rule and calls a tool refuses itself; ARTEX sets no deny rules.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: permission/permission.go, lines: 51, text: "allow everything (except deny rules)"}
    - {type: contains, source: norma-v0.4.3, path: permission/permission.go, lines: 86-92, text: "deny rules (absolute priority)"}
    - {type: absent, source: artex-v0.3.15, pattern: "Disallowed", include: ["agent/*.go", "server/*.go"], exclude: ["*_test.go"]}

- id: C015
  topic: engine
  statement: The engine's shell tool refuses four catastrophic commands in any mode (deleting the root filesystem, a fork bomb, formatting a device, overwriting a disk). This floor can't be switched off.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: tool/bash.go, lines: 17-25, text: "hard-denied regardless of mode"}
    - {type: contains, source: norma-v0.4.3, path: tool/bash.go, lines: 61, text: "func bashPermissions"}

- id: C016
  topic: engine
  statement: The engine's interactive shell tools always allow; the catastrophic-command floor covers only the shell tool.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: tool/shell_tools.go, lines: 28-30, text: "permission.Allowed()"}

- id: C017
  topic: engine
  statement: Shell commands time out after two minutes by default and ten minutes at most.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: tool/bash.go, lines: 86, text: "120 * time.Second"}
    - {type: contains, source: norma-v0.4.3, path: tool/bash.go, lines: 89-90, text: "600 * time.Second"}

- id: C018
  topic: engine
  statement: Commands the agents run, and plugin (MCP) servers, inherit the whole environment of the host process.
  status: code
  note: When no extra variables are passed, Go's default for a child process is also to inherit the parent's environment.
  evidence:
    - {type: contains, source: norma-v0.4.3, path: tool/task.go, lines: 140-145, text: "append(os.Environ(), extra...)"}
    - {type: contains, source: norma-v0.4.3, path: mcp/stdio.go, lines: 33-37, text: "os.Environ()"}

- id: C019
  topic: engine
  statement: The engine's web fetch asks for approval in normal mode and has no block on internal or private addresses.
  status: code
  evidence:
    - {type: contains, source: norma-v0.4.3, path: tool/webfetch.go, lines: 57-62, text: "permission.AskUser"}
    - {type: absent, source: norma-v0.4.3, path: tool/webfetch.go, pattern: "(?i)isprivate|isloopback|169\\.254|private.?(ip|address|network)"}

- id: C020
  topic: engine
  statement: The engine has no defence against prompt injection in tool output; the only mention is in an example app's prompt.
  status: code
  note: A keyword search, not a test. The word "untrusted" appears once outside the example (tool/tool.go:118), about tools that validate the model's own malformed input; it isn't about tool output.
  evidence:
    - {type: contains, source: norma-v0.4.3, path: examples/coding-agent/prompt.go, lines: 17, text: "prompt injection"}
    - {type: absent, source: norma-v0.4.3, pattern: "(?i)prompt.?injection", include: ["*.go"], exclude: ["examples/*", "*_test.go"]}
    - {type: contains, source: norma-v0.4.3, path: tool/tool.go, lines: 118, text: "treats its input as untrusted bytes"}

- id: C021
  topic: engine
  statement: norma v0.4.3 has no licence file.
  status: code
  evidence:
    - {type: file_missing, source: norma-v0.4.3, paths: [LICENSE, LICENSE.md, LICENSE.txt, COPYING]}

- id: C022
  topic: engine
  statement: The engine doesn't phone home; its only hard-coded hosts are AI model providers and search services.
  status: code
  evidence:
    - {type: manual, how: "List every http(s) URL in the engine's non-test Go files and classify each host"}

# --- Agents and tools ---------------------------------------------------------------

- id: C030
  topic: agents
  statement: ARTEX ships six built-in agents - goals, planner, main agent, worker, auto and pentest - and no separate verification agent.
  status: code
  evidence:
    - {type: contains, source: artex-v0.3.15, path: db/db.go, lines: 191, text: "var builtinAgents"}
    - {type: absent, source: artex-v0.3.15, path: db/db.go, lines: 191-214, pattern: "(?i)\\{\"verif"}

- id: C031
  topic: agents
  statement: Three workers run at a time by default.
  status: code
  evidence:
    - {type: contains, source: artex-v0.3.15, path: server/manager.go, lines: 283-284, text: "defaultWorkers = 3"}

- id: C032
  topic: agents
  statement: A cap on how many tasks run at once is off by default, and 5 when switched on.
  status: code
  evidence:
    - {type: contains, source: artex-v0.3.15, path: server/manager.go, lines: 271-273, text: "task_concurrency_enabled"}
    - {type: contains, source: artex-v0.3.15, path: server/manager.go, lines: 285-286, text: "defaultConcurrencyLimit"}

- id: C033
  topic: safety
  statement: ARTEX switches the engine's approval step to bypass for every agent.
  status: code
  evidence:
    - {type: contains, source: artex-v0.3.15, path: agent/mainagent.go, lines: 142, text: "permission.ModeBypass"}
