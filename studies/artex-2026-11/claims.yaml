# Claims for the study "ARTEX: what the code says" (artex-2026-11).
#
# Every finding in this study's reports is one of these claims. Each claim has an ID,
# a plain-English statement, a status and its evidence. Outputs cite claims by ID
# (for example artex-2026-11#C026), so a correction here reaches every output.
#
# Status values:
#   code       checked against the pinned source code below
#   source     checked against a public source (see `references`)
#   secondary  from a secondary source: a report about someone else's research
#   inference  our reasoning from the evidence; the reasoning is in `note`
#   open       not settled; say so wherever it's used
#
# Code evidence can be re-checked with scripts/check_claims.py against your own copies
# of the sources. This repository doesn't contain or download them; see METHODOLOGY.md.
#
# Licence: CC BY 4.0. Café Security Research.

